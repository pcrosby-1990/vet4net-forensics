<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a29bfe;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#0a0a0a"/>
  
  <!-- Spiral shimmer -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#shimmerGrad)" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="150;160;150" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="120" fill="none" stroke="url(#shimmerGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="120;130;120" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="90" fill="none" stroke="url(#shimmerGrad)" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="90;100;90" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central glyph -->
  <text x="200" y="220" font-family="serif" font-size="80" fill="#a29bfe" text-anchor="middle">
    ✧
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="280" font-family="serif" font-size="18" fill="#74b9ff" text-anchor="middle">
    Awaiting Image
  </text>
</svg>
