<!DOCTYPE html>
<html>
<head>
  <title>Unity Shadow Integration Lab</title>
  <style>
    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #ff0; }
    .lab {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #ff0;
      border-radius: 6px;
    }
    label, input, button {
      display: block;
      margin: 0.5em 0;
      font-size: 1em;
    }
    button {
      background: #333300;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #666600; }
  </style>
</head>
<body>
  <h1>🧪 Unity Shadow Integration Lab</h1>
  <div class="lab">
    <label>Shadow Trait: <input id="shadowTrait" /></label>
    <label>Associated Emotion: <input id="shadowEmotion" /></label>
    <button onclick="integrateShadow()">Integrate Shadow</button>
    <div id="integrationResult"></div>
  </div>

  <script src="shadow_integration_lab.js"></script>
</body>
</html>
