<!DOCTYPE html>
<html>
<head>
  <title>Unity Emotion Synthesizer</title>
  <style>
    body {
      background: #0c0c0c;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #f0f; }
    .synth {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #f0f;
      border-radius: 6px;
    }
    label, select, button {
      display: block;
      margin: 0.5em 0;
      font-size: 1em;
    }
    button {
      background: #330033;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #550055; }
    .result {
      margin-top: 1em;
      padding: 1em;
      background: #222;
      border-left: 3px solid #f0f;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>🎛️ Unity Emotion Synthesizer</h1>
  <div class="synth">
    <label>Primary Emotion:
      <select id="emotion1">
        <option>Joy</option>
        <option>Grief</option>
        <option>Wonder</option>
        <option>Fear</option>
        <option>Longing</option>
        <option>Anger</option>
      </select>
    </label>
    <label>Secondary Emotion:
      <select id="emotion2">
        <option>Joy</option>
        <option>Grief</option>
        <option>Wonder</option>
        <option>Fear</option>
        <option>Longing</option>
        <option>Anger</option>
      </select>
    </label>
    <button onclick="synthesize()">Synthesize</button>
    <div class="result" id="synthResult"></div>
  </div>

  <script src="emotion_synthesizer.js"></script>
</body>
</html>
