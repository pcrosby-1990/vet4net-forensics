<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🗂️ Collapse Tone Archive Visualizer</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    canvas {
      border: 2px solid #ff0;
      background-color: #222;
      margin-top: 10px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
  </style>
</head>
<body>

  <h2>🗂️ Collapse Tone Archive Visualizer</h2>
  <canvas id="toneGridCanvas" width="600" height="300"></canvas>
  <br>
  <button onclick="renderToneGrid()">Render Archive Grid</button>

  <script>
    const toneArchive = [
      { sequence: ["echo", "pulse"], emotion: "Joy", timestamp: "2025-10-30 14:00" },
      { sequence: ["thread", "collapse"], emotion: "Fear", timestamp: "2025-10-30 15:00" },
      { sequence: ["pulse", "echo", "collapse"], emotion: "Regret", timestamp: "2025-10-31 09:00" }
    ];

    function renderToneGrid() {
      const canvas = document.getElementById('toneGridCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const toneColors = {
        echo: "#ffff99",
        pulse: "#ff99ff",
        thread: "#99ffcc",
        collapse: "#ff6666"
      };

      toneArchive.forEach((entry, row) => {
        entry.sequence.forEach((tone, col) => {
          ctx.fillStyle = toneColors[tone] || "#888";
          ctx.fillRect(col * 60 + 40, row * 60 + 40, 40, 40);
          ctx.strokeRect(col * 60 + 40, row * 60 + 40, 40, 40);
        });

        ctx.fillStyle = "#fff";
        ctx.font = "12px monospace";
        ctx.fillText(entry.emotion, 10, row * 60 + 65);
        ctx.fillText(entry.timestamp, 250, row * 60 + 65);
      });
    }
  </script>

</body>
</html>
