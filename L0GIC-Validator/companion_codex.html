<!DOCTYPE html>
<html>
<head>
  <title>Unity Companion Codex</title>
  <style>
    body {
      background: #0c0c0c;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #ff0; }
    .codex {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1em;
      margin-top: 2em;
    }
    .companion {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #ff0;
      border-radius: 6px;
      transition: transform 0.3s ease;
    }
    .companion:hover {
      transform: scale(1.05);
      border-left-color: #f0f;
    }
    .companion h3 { margin: 0; color: #ff0; }
    .companion p { font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>📖 Unity Companion Codex</h1>
  <div class="codex" id="companionCodex"></div>

  <script src="companion_codex.js"></script>
</body>
</html>
