<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⚛️ Glyph Fusion Reactor</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #cc66ff;
    }
    input {
      width: 100%;
      padding: 8px;
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      margin-top: 10px;
      font-family: monospace;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
    #fusionOutput {
      margin-top: 20px;
      border-left: 4px solid #cc66ff;
      padding-left: 12px;
    }
  </style>
</head>
<body>

  <h2>⚛️ Glyph Fusion Reactor</h2>
  <p>Enter up to three glyphs to fuse:</p>
  <input id="glyph1" placeholder="e.g. Glyph of Reflection">
  <input id="glyph2" placeholder="e.g. Glyph of Resonance">
  <input id="glyph3" placeholder="e.g. Glyph of Rupture">
  <br>
  <button onclick="fuseGlyphs()">Initiate Fusion</button>
  <div id="fusionOutput"></div>

  <script>
    function fuseGlyphs() {
      const g1 = document.getElementById('glyph1').value.trim();
      const g2 = document.getElementById('glyph2').value.trim();
      const g3 = document.getElementById('glyph3').value.trim();
      const output = document.getElementById('fusionOutput');

      const glyphs = [g1, g2, g3].filter(g => g.length > 0);
      if (glyphs.length < 2) {
        output.innerText = "⚠️ Enter at least two glyphs to fuse.";
        return;
      }

      const fusionName = `Fusion of ${glyphs.join(" + ")}`;
      const hybrid = `🜂 Hybrid Glyph: ${glyphs[0].split(" ")[2]}-${glyphs[glyphs.length - 1].split(" ")[2]} Core`;
      const effect = `Effect: Combines ${glyphs.length} emotional vectors into unified resonance`;

      output.innerHTML = `
        <h3>🧬 Fusion Complete</h3>
        <p><strong>${fusionName}</strong></p>
        <p>${hybrid}</p>
        <p>${effect}</p>
        <p><strong>New glyph ready for transmission.</strong></p>
      `;
    }
  </script>

</body>
</html>
