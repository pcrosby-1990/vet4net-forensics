<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📈 Resonance Threshold Analyzer</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #ff6699;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #555;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #333;
      color: #fff;
    }
    tr.threshold-crossed {
      background-color: #660000;
      color: #fff;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
  </style>
</head>
<body>

  <h2>📈 Resonance Threshold Analyzer</h2>
  <button onclick="analyzeThresholds()">Analyze Resonance</button>
  <table id="thresholdTable">
    <thead>
      <tr>
        <th>Companion</th>
        <th>Emotion</th>
        <th>Resonance</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const resonanceArchive = [
      { companion: "Echo", emotion: "Regret", resonance: 45 },
      { companion: "Thread", emotion: "Fear", resonance: 85 },
      { companion: "Pulse", emotion: "Joy", resonance: 95 },
      { companion: "Echo", emotion: "Hope", resonance: 60 },
      { companion: "Thread", emotion: "Joy", resonance: 40 },
      { companion: "Pulse", emotion: "Regret", resonance: 20 }
    ];

    const threshold = 75;

    function analyzeThresholds() {
      const tbody = document.querySelector("#thresholdTable tbody");
      tbody.innerHTML = "";

      resonanceArchive.forEach(entry => {
        const row = document.createElement("tr");
        if (entry.resonance >= threshold) {
          row.classList.add("threshold-crossed");
        }

        row.innerHTML = `
          <td>${entry.companion}</td>
          <td>${entry.emotion}</td>
          <td>${entry.resonance}</td>
          <td>${entry.resonance >= threshold ? "⚡ Threshold Crossed" : "Stable"}</td>
        `;
        tbody.appendChild(row);
      });
    }
  </script>

</body>
</html>
