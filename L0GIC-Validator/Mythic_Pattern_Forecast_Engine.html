<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🔮 Mythic Pattern Forecast Engine</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #cc99ff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #555;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #333;
      color: #fff;
    }
    tr.forecasted {
      background-color: #330066;
      color: #fff;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
  </style>
</head>
<body>

  <h2>🔮 Mythic Pattern Forecast Engine</h2>
  <button onclick="forecastPatterns()">Forecast Symbolic Patterns</button>
  <table id="forecastTable">
    <thead>
      <tr>
        <th>Companion</th>
        <th>Recent Emotion</th>
        <th>Resonance</th>
        <th>Forecasted Glyph</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const recentData = [
      { companion: "Echo", emotion: "Regret", resonance: 65 },
      { companion: "Thread", emotion: "Hope", resonance: 80 },
      { companion: "Pulse", emotion: "Joy", resonance: 95 },
      { companion: "Echo", emotion: "Fear", resonance: 40 },
      { companion: "Thread", emotion: "Joy", resonance: 50 },
      { companion: "Pulse", emotion: "Regret", resonance: 30 }
    ];

    function forecastPatterns() {
      const tbody = document.querySelector("#forecastTable tbody");
      tbody.innerHTML = "";

      recentData.forEach(entry => {
        const glyph = forecastGlyph(entry.emotion, entry.resonance);
        const row = document.createElement("tr");
        row.classList.add("forecasted");

        row.innerHTML = `
          <td>${entry.companion}</td>
          <td>${entry.emotion}</td>
          <td>${entry.resonance}</td>
          <td>${glyph}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function forecastGlyph(emotion, resonance) {
      if (resonance > 85) return "Glyph of Resonance";
      if (emotion === "Regret") return "Glyph of Reflection";
      if (emotion === "Hope") return "Glyph of Projection";
      if (emotion === "Fear") return "Glyph of Rupture";
      if (emotion === "Joy") return "Glyph of Radiance";
      return "Glyph of Echo";
    }
  </script>

</body>
</html>
