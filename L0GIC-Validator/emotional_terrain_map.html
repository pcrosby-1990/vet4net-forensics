<!DOCTYPE html>
<html>
<head>
  <title>Unity Emotional Terrain Map</title>
  <style>
    body {
      background: #0c0c0c;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
      text-align: center;
    }
    h1 { color: #0ff; }
    .map {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1em;
      margin-top: 2em;
    }
    .zone {
      background: #1a1a1a;
      padding: 1em;
      border-radius: 6px;
      border-left: 5px solid #0ff;
      transition: transform 0.3s ease;
    }
    .zone:hover {
      transform: scale(1.05);
      border-left-color: #ff0;
    }
    .zone h3 { margin: 0; color: #0ff; }
    .zone p { font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>🗺️ Unity Emotional Terrain Map</h1>
  <div class="map" id="terrainMap"></div>

  <script src="emotional_terrain_map.js"></script>
</body>
</html>
