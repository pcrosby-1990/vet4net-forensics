<!DOCTYPE html>
<html>
<head>
  <title>Unity Companion Theater</title>
  <style>
    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #f0f; }
    .stage {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #f0f;
      border-radius: 6px;
      min-height: 200px;
    }
    .dialogue {
      margin: 1em 0;
      font-style: italic;
    }
    .companion {
      font-weight: bold;
      color: #ff0;
    }
  </style>
</head>
<body>
  <h1>🎭 Unity Companion Theater</h1>
  <div class="stage" id="theaterStage"></div>

  <script src="companion_theater.js"></script>

</html>
