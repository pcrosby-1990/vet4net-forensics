<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌀 Emotional Resonance Field Mapper</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #66ffff;
    }
    canvas {
      border: 2px solid #66ffff;
      background-color: #222;
      margin-top: 10px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
  </style>
</head>
<body>

  <h2>🌀 Emotional Resonance Field Mapper</h2>
  <canvas id="resonanceCanvas" width="600" height="300"></canvas>
  <br>
  <button onclick="mapResonance()">Map Resonance Field</button>

  <script>
    const resonanceData = [
      { module: "Echo", emotion: "Regret", intensity: 30 },
      { module: "Thread", emotion: "Fear", intensity: 70 },
      { module: "Pulse", emotion: "Joy", intensity: 90 },
      { module: "Echo", emotion: "Hope", intensity: 50 },
      { module: "Thread", emotion: "Joy", intensity: 40 },
      { module: "Pulse", emotion: "Regret", intensity: 20 }
    ];

    function mapResonance() {
      const canvas = document.getElementById('resonanceCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const emotionColors = {
        Regret: "#ffff99",
        Fear: "#ff6666",
        Joy: "#ff99ff",
        Hope: "#66ccff"
      };

      resonanceData.forEach((entry, i) => {
        const x = 100 + (i % 3) * 150;
        const y = 50 + Math.floor(i / 3) * 120;
        const radius = entry.intensity / 2 + 10;

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, 2 * Math.PI);
        ctx.fillStyle = emotionColors[entry.emotion] || "#888";
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.font = "12px monospace";
        ctx.fillText(`${entry.module}`, x - radius, y + radius + 15);
        ctx.fillText(`${entry.emotion} (${entry.intensity})`, x - radius, y + radius + 30);
      });
    }
  </script>

</body>
</html>
