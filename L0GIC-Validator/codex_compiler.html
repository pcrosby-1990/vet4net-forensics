<!DOCTYPE html>
<html>
<head>
  <title>Unity Codex Compiler</title>
  <style>
    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #0ff; }
    .compiler {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #0ff;
      border-radius: 6px;
    }
    button {
      background: #003366;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 0.5em;
    }
    button:hover { background: #005599; }
    .codex {
      margin-top: 1em;
      padding: 1em;
      background: #222;
      border-left: 3px solid #0ff;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>📘 Unity Codex Compiler</h1>
  <div class="compiler">
    <button onclick="compileCodex()">Compile Personal Mythbook</button>
    <div class="codex" id="codexOutput"></div>
  </div>

  <script src="codex_compiler.js"></script>
</body>
</html>
