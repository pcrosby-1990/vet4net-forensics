<!DOCTYPE html>
<html>
<head>
  <title>Unity Threshold Oracle</title>
  <style>
    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #f0f; }
    .oracle {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #f0f;
      border-radius: 6px;
    }
    label, input, select, button {
      display: block;
      margin: 0.5em 0;
      font-size: 1em;
    }
    button {
      background: #330033;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #550055; }
    .prediction {
      margin-top: 1em;
      padding: 1em;
      background: #222;
      border-left: 3px solid #f0f;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>🔮 Unity Threshold Oracle</h1>
  <div class="oracle">
    <label>Current Emotion: <input id="emotionInput" /></label>
    <label>Dominant Trait: <input id="traitInput" /></label>
    <button onclick="predictShift()">Consult Oracle</button>
    <div class="prediction" id="oracleOutput"></div>
  </div>

  <script src="threshold_oracle.js"></script>
</body>
</html>
