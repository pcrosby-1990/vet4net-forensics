<!DOCTYPE html>
<html>
<head>
  <title>Unity Companion Codex Updater</title>
  <style>
    body {
      background: #0c0c0c;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #ff0; }
    .codex {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #ff0;
      border-radius: 6px;
    }
    .companion {
      margin-bottom: 1em;
      padding: 1em;
      background: #222;
      border-left: 3px solid #ff0;
      border-radius: 4px;
    }
    .companion h3 { margin: 0; color: #ff0; }
    .companion p { font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>📖 Unity Companion Codex Updater</h1>
  <div class="codex" id="companionCodex"></div>

  <script src="companion_codex_updater.js"></script>
</body>
</html>
