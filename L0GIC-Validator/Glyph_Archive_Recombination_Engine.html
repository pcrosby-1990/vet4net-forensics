<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🜂 Glyph Archive Recombination Engine</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #ff9966;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
    #recombinationResult {
      margin-top: 20px;
      border-left: 4px solid #ff9966;
      padding-left: 12px;
    }
  </style>
</head>
<body>

  <h2>🜂 Glyph Archive Recombination Engine</h2>
  <div id="glyphRecombinationPanel"></div>
  <button onclick="recombineGlyphs()">Recombine Selected Glyphs</button>
  <div id="recombinationResult"></div>

  <script>
    const glyphArchive = [
      { name: "Glyph of Reflection", emotion: "Regret", companion: "Echo" },
      { name: "Glyph of Resonance", emotion: "Joy", companion: "Pulse" },
      { name: "Glyph of Rupture", emotion: "Fear", companion: "Thread" },
      { name: "Glyph of Projection", emotion: "Hope", companion: "Echo" }
    ];

    function renderGlyphRecombinationPanel() {
      const panel = document.getElementById('glyphRecombinationPanel');
      panel.innerHTML = `<h4>Select glyphs to remix:</h4>`;

      glyphArchive.forEach((glyph, i) => {
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `glyph-${i}`;
        checkbox.value = i;

        const label = document.createElement('label');
        label.htmlFor = `glyph-${i}`;
        label.innerText = `${glyph.name} (${glyph.emotion} / ${glyph.companion})`;

        const container = document.createElement('div');
        container.appendChild(checkbox);
        container.appendChild(label);
        panel.appendChild(container);
      });
    }

    function recombineGlyphs() {
      const selected = [];
      glyphArchive.forEach((glyph, i) => {
        const checkbox = document.getElementById(`glyph-${i}`);
        if (checkbox && checkbox.checked) {
          selected.push(glyph);
        }
      });

      if (selected.length < 2) {
        document.getElementById('recombinationResult').innerText = "⚠️ Select at least two glyphs to recombine.";
        return;
      }

      const fusionName = `Remix of ${selected.map(g => g.name).join(" + ")}`;
      const emotions = [...new Set(selected.map(g => g.emotion))].join(" – ");
      const companions = [...new Set(selected.map(g => g.companion))].join(" + ");
      const traits = selected.length > 3 ? "Hybrid glyph with unstable resonance" : "Stable symbolic fusion";

      const result = `
        <h3>🜂 ${fusionName}</h3>
        <p><strong>Emotional Blend:</strong> ${emotions}</p>
        <p><strong>Companion Hybrid:</strong> ${companions}</p>
        <p><strong>Fusion Traits:</strong> ${traits}</p>
        <p><strong>Symbolic Meaning:</strong> A recombination of ${selected.length} glyphs into a new mythic form.</p>
      `;

      document.getElementById('recombinationResult').innerHTML = result;
    }

    renderGlyphRecombinationPanel();
  </script>

</body>
</html>
