<!DOCTYPE html>
<html>
<head>
  <title>Unity Ritual Composer</title>
  <style>
    body { background: #0d0d0d; color: #eee; font-family: 'Georgia', serif; padding: 2em; }
    h1 { color: #f33; }
    .composer { background: #1a1a1a; padding: 1em; border-left: 5px solid #f33; border-radius: 6px; }
    label, select, input, textarea, button {
      display: block;
      margin: 0.5em 0;
      font-size: 1em;
    }
    button {
      background: #330000;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #550000; }
  </style>
</head>
<body>
  <h1>🕯️ Unity Ritual Composer</h1>
  <div class="composer">
    <label>Title: <input id="ritualTitle" /></label>
    <label>Intent: <input id="ritualIntent" /></label>
    <label>Emotion: <input id="ritualEmotion" /></label>
    <label>Terrain Zone: <input id="ritualTerrain" /></label>
    <label>Items (comma-separated): <input id="ritualItems" /></label>
    <label>Companions (comma-separated): <input id="ritualCompanions" /></label>
    <button onclick="compose()">Compose Ritual</button>
  </div>

  <script src="ritual_composer_ui.js"></script>
</body>
</html>
