<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🧭 Companion Memory Divergence Tracker</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #66ccff;
    }
    canvas {
      border: 2px solid #66ccff;
      background-color: #222;
      margin-top: 10px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
  </style>
</head>
<body>

  <h2>🧭 Companion Memory Divergence Tracker</h2>
  <canvas id="divergenceCanvas" width="600" height="300"></canvas>
  <br>
  <button onclick="renderDivergence()">Render Divergence Map</button>

  <script>
    function renderDivergence() {
      const canvas = document.getElementById('divergenceCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const paths = {
        Echo: ["Regret", "Hope", "Joy"],
        Thread: ["Fear", "Hope", "Regret"],
        Pulse: ["Joy", "Fear", "Resonance"]
      };

      const emotionColors = {
        Regret: "#ffff99",
        Hope: "#66ccff",
        Joy: "#ff99ff",
        Fear: "#99ffcc",
        Resonance: "#ffcc66"
      };

      Object.entries(paths).forEach(([companion, emotions], i) => {
        ctx.beginPath();
        ctx.strokeStyle = "#888";
        ctx.moveTo(50, 50 + i * 80);

        emotions.forEach((emotion, j) => {
          const x = j * 150 + 50;
          const y = 50 + i * 80;
          ctx.lineTo(x, y);
          ctx.fillStyle = emotionColors[emotion] || "#888";
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, 2 * Math.PI);
          ctx.fill();
        });

        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = "12px monospace";
        ctx.fillText(companion, 10, 50 + i * 80);
      });
    }
  </script>

</body>
</html>
