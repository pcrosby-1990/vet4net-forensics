<!DOCTYPE html>
<html>
<head>
  <title>Unity Myth Generator</title>
  <style>
    body { background: #0e0e0e; color: #eee; font-family: 'Georgia', serif; padding: 2em; }
    h1 { color: #f0f; }
    #mythBox {
      background: #1a1a1a;
      padding: 1em;
      margin-top: 1em;
      border-left: 5px solid #f0f;
      border-radius: 6px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 1.5s ease, opacity 1s ease;
      opacity: 0;
    }
    #mythBox.revealed {
      max-height: 500px;
      opacity: 1;
    }
    button {
      background: #333;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      margin-right: 0.5em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #555; }
  </style>
</head>
<body>
  <h1>📖 Unity Myth Generator</h1>
  <button onclick="generateMyth()">Generate New Myth</button>
  <button onclick="exportToCodex()">Export to Codex</button>
  <button onclick="shareWithCompanion()">Share with Companion</button>

  <div id="mythBox"></div>

  <script src="myth_generator_ui.js"></script>
</body>
</html>
