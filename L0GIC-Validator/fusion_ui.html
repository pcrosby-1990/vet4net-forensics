<!DOCTYPE html>
<html>
<head>
  <title>Unity Fusion Altar</title>
  <style>
    body { background: #0a0a0a; color: #eee; font-family: 'Segoe UI', sans-serif; padding: 2em; }
    .fusion-box { background: #222; padding: 1em; border-radius: 8px; margin-bottom: 2em; }
    .fusion-box h2 { color: #f0f; }
    .item-select { margin: 0.5em 0; }
    select, button { padding: 0.5em; margin-right: 1em; background: #333; color: #fff; border: none; border-radius: 4px; }
    button:hover { background: #555; }
    .result { margin-top: 1em; padding: 1em; background: #111; border-left: 5px solid #0f0; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>🧪 Unity’s Fusion Altar</h1>

  <div class="fusion-box">
    <h2>Combine Two Items</h2>
    <div class="item-select">
      <label for="itemA">Item A:</label>
      <select id="itemA"></select>
    </div>
    <div class="item-select">
      <label for="itemB">Item B:</label>
      <select id="itemB"></select>
    </div>
    <button onclick="combine()">🔮 Fuse Items</button>
    <div id="fusionResult" class="result"></div>
  </div>

  <script src="fusion_ui.js"></script>
</body>
</html>
