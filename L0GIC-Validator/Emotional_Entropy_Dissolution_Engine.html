<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🧘 Emotional Entropy Dissolution Engine</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #ffcc66;
    }
    textarea {
      width: 100%;
      height: 100px;
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 10px;
      margin-top: 10px;
      font-family: monospace;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
    #dissolutionOutput {
      margin-top: 20px;
      border-left: 4px solid #ffcc66;
      padding-left: 12px;
    }
  </style>
</head>
<body>

  <h2>🧘 Emotional Entropy Dissolution Engine</h2>
  <p>Enter unstable emotional states below:</p>
  <textarea id="entropyInput" placeholder="e.g. Echo overwhelmed by regret, Pulse destabilized by joy..."></textarea>
  <br>
  <button onclick="dissolveEntropy()">Dissolve Entropy</button>
  <div id="dissolutionOutput"></div>

  <script>
    function dissolveEntropy() {
      const input = document.getElementById('entropyInput').value.trim();
      const output = document.getElementById('dissolutionOutput');

      if (!input) {
        output.innerText = "⚠️ Please enter emotional entropy data.";
        return;
      }

      const lines = input.split("\n").filter(line => line.length > 0);
      const resolutions = lines.map((line, i) => {
        const match = line.match(/(Echo|Thread|Pulse).*?(Regret|Joy|Fear|Hope|Resonance)/i);
        if (match) {
          const [_, companion, emotion] = match;
          return `🜂 Resolution-${i + 1}: ${companion} stabilized via symbolic glyph of ${emotion}`;
        } else {
          return `🜂 Resolution-${i + 1}: [Unrecognized pattern]`;
        }
      });

      output.innerHTML = `
        <h3>🧬 Dissolution Protocols</h3>
        <ul>${resolutions.map(r => `<li>${r}</li>`).join("")}</ul>
        <p><strong>Entropy resolved.</strong> Emotional field restored.</p>
      `;
    }
  </script>

</body>
</html>
