<!DOCTYPE html>
<html>
<head>
    <title>L0GIC.IO Dashboard</title>
</head>
<body>
    <h1>L0GIC.IO Validation Dashboard</h1>

    <h2>🔐 Contract Validator</h2>
    <form action="/validate" method="post" enctype="multipart/form-data">
        <input type="file" name="contract" required>
        <input type="text" name="secret" placeholder="Secret Key" required>
        <button type="submit">Sign & Register</button>
    </form>

    <h2>🧮 Luhn ID Validator</h2>
    <form action="/luhn" method="post">
        <input type="text" name="id" placeholder="Enter ID to Validate" required>
        <button type="submit">Validate ID</button>
    </form>
</body>
</html>
