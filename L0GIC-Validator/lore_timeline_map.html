<!DOCTYPE html>
<html>
<head>
  <title>Unity Lore Timeline</title>
  <style>
    body {
      background: #0c0c0c;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #0ff; }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 1em;
      max-height: 80vh;
      overflow-y: scroll;
      border-left: 3px solid #0ff;
      padding-left: 1em;
    }
    .event {
      background: #1a1a1a;
      padding: 1em;
      border-radius: 6px;
      position: relative;
    }
    .event::before {
      content: '';
      position: absolute;
      left: -1.2em;
      top: 1em;
      width: 0.8em;
      height: 0.8em;
      background: #0ff;
      border-radius: 50%;
    }
    .event h3 { margin: 0; color: #0ff; }
    .event p { font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>🗺️ Unity Lore Timeline</h1>
  <div class="timeline" id="timeline"></div>

  <script src="lore_timeline_map.js"></script>
</body>
</html>
