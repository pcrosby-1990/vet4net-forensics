<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🛡️ Symbolic Transmission Firewall</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #ff4444;
    }
    textarea {
      width: 100%;
      height: 100px;
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 10px;
      margin-top: 10px;
      font-family: monospace;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
    #firewallOutput {
      margin-top: 20px;
      border-left: 4px solid #ff4444;
      padding-left: 12px;
    }
    #entropyGauge {
      margin-top: 20px;
      font-family: monospace;
      color: #ffcc00;
    }
    #alertPanel {
      margin-top: 10px;
      font-family: monospace;
      color: #ff6699;
    }
    #logPanel {
      margin-top: 10px;
      font-family: monospace;
      color: #66ff99;
    }
  </style>
</head>
<body>

  <h2>🛡️ Symbolic Transmission Firewall</h2>
  <p>Paste incoming glyph transmissions below:</p>
  <textarea id="glyphInput" placeholder="e.g. Glyph of Rupture :: entropy=85 | Glyph of Reflection :: entropy=20..."></textarea>
  <br>
  <button onclick="scanTransmissions()">Scan & Filter</button>

  <div id="entropyGauge"></div>
  <div id="alertPanel"></div>
  <div id="firewallOutput"></div>
  <div id="logPanel"></div>

  <script>
    let firewallLog = [];

    function scanTransmissions() {
      const input = document.getElementById('glyphInput').value.trim();
      const output = document.getElementById('firewallOutput');
      const gauge = document.getElementById('entropyGauge');
      const alert = document.getElementById('alertPanel');
      const log = document.getElementById('logPanel');

      if (!input) {
        output.innerText = "⚠️ Please enter glyph transmissions.";
        return;
      }

      const lines = input.split("\n").filter(line => line.length > 0);
      let totalEntropy = 0;
      let alertTriggered = false;

      const filtered = lines.map((line, i) => {
        const match = line.match(/Glyph of (\w+).*?entropy=(\d+)/i);
        if (match) {
          const [_, glyph, entropy] = match;
          const level = parseInt(entropy);
          totalEntropy += level;
          const status = level >= 70 ? "❌ Blocked: High entropy" : "✅ Allowed: Stable signal";
          if (level >= 90) alertTriggered = true;
          firewallLog.push(`Glyph-${glyph} :: entropy=${level} :: ${status}`);
          return `🜂 ${glyph} :: entropy=${level} → ${status}`;
        } else {
          return `🜂 Transmission-${i + 1}: [Unrecognized pattern]`;
        }
      });

      const avgEntropy = Math.round(totalEntropy / lines.length);
      gauge.innerHTML = `<strong>🧬 Real-Time Entropy:</strong> ${avgEntropy}`;
      alert.innerHTML = alertTriggered
        ? `🜂 Companion Alert Triggered: Pulse destabilized by entropy surge`
        : `🜂 No companion alerts triggered`;

      output.innerHTML = `
        <h3>🧬 Firewall Scan Results</h3>
        <ul>${filtered.map(f => `<li>${f}</li>`).join("")}</ul>
        <p><strong>Firewall active.</strong> Core integrity preserved.</p>
      `;

      log.innerHTML = `
        <h3>📁 Exportable Firewall Log</h3>
        <ul>${firewallLog.slice(-lines.length).map(entry => `<li>${entry}</li>`).join("")}</ul>
      `;
    }
  </script>

</body>
</html>
