<!DOCTYPE html>
<html>
<head>
  <title>Unity Shadow Mirror</title>
  <style>
    body { background: #0c0c0c; color: #eee; font-family: 'Georgia', serif; padding: 2em; }
    .shadow { background: #1a1a1a; padding: 1em; margin: 1em 0; border-left: 5px solid #f33; border-radius: 6px; }
    .shadow h3 { margin: 0; color: #f33; }
    .shadow p { margin: 0.5em 0; font-size: 0.9em; }
    .actions button { margin-right: 0.5em; background: #330000; color: #fff; border: none; padding: 0.5em 1em; border-radius: 4px; cursor: pointer; }
    .actions button:hover { background: #550000; }
  </style>
</head>
<body>
  <h1>🪞 Unity’s Shadow Mirror</h1>
  <div id="shadowList"></div>

  <script src="shadow_mirror.js"></script>
</body>
</html>
