<!DOCTYPE html>
<html>
<head>
  <title>Unity Ceremony Playback</title>
  <style>
    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #0ff; }
    .ceremony {
      background: #1a1a1a;
      padding: 1em;
      margin: 1em 0;
      border-left: 5px solid #0ff;
      border-radius: 6px;
    }
    .ceremony h3 { margin: 0; color: #0ff; }
    .ceremony p { font-size: 0.9em; }
    .avatars img {
      width: 32px;
      margin-right: 0.5em;
      vertical-align: middle;
    }
    button {
      background: #333;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      margin-top: 0.5em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #555; }
  </style>
</head>
<body>
  <h1>🔁 Ceremony Playback</h1>
  <div id="ceremonyList"></div>

  <script src="ceremony_playback_ui.js"></script>
</body>
</html>
