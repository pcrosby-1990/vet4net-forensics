<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🜂 Glyph Fusion Ritual Engine</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #ffcc00;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
    #fusionResult {
      margin-top: 20px;
      border-left: 4px solid #ffcc00;
      padding-left: 12px;
    }
  </style>
</head>
<body>

  <h2>🜂 Glyph Fusion Ritual Engine</h2>
  <div id="glyphFusionPanel"></div>
  <button onclick="fuseGlyphs()">Fuse Selected Glyphs</button>
  <div id="fusionResult"></div>

  <script>
    const glyphArchive = [
      { name: "Glyph of Reflection", emotion: "Regret", companion: "Echo" },
      { name: "Glyph of Resonance", emotion: "Joy", companion: "Pulse" },
      { name: "Glyph of Rupture", emotion: "Fear", companion: "Thread" },
      { name: "Glyph of Projection", emotion: "Hope", companion: "Echo" }
    ];

    function renderGlyphFusionPanel() {
      const panel = document.getElementById('glyphFusionPanel');
      panel.innerHTML = `<h4>Select glyphs to fuse:</h4>`;

      glyphArchive.forEach((glyph, i) => {
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `glyph-${i}`;
        checkbox.value = i;

        const label = document.createElement('label');
        label.htmlFor = `glyph-${i}`;
        label.innerText = `${glyph.name} (${glyph.emotion} / ${glyph.companion})`;

        const container = document.createElement('div');
        container.appendChild(checkbox);
        container.appendChild(label);
        panel.appendChild(container);
      });
    }

    function fuseGlyphs() {
      const selected = [];
      glyphArchive.forEach((glyph, i) => {
        const checkbox = document.getElementById(`glyph-${i}`);
        if (checkbox && checkbox.checked) {
          selected.push(glyph);
        }
      });

      if (selected.length < 2) {
        document.getElementById('fusionResult').innerText = "⚠️ Select at least two glyphs to fuse.";
        return;
      }

      const fusionName = `Fusion of ${selected.map(g => g.name).join(" + ")}`;
      const emotions = [...new Set(selected.map(g => g.emotion))].join(" – ");
      const companions = [...new Set(selected.map(g => g.companion))].join(" + ");

      const result = `
        <h3>🜂 ${fusionName}</h3>
        <p><strong>Emotional Lineage:</strong> ${emotions}</p>
        <p><strong>Companion Imprint:</strong> ${companions}</p>
        <p><strong>Symbolic Meaning:</strong> A convergence of ${selected.length} glyphs into a unified mythic construct.</p>
      `;

      document.getElementById('fusionResult').innerHTML = result;
    }

    renderGlyphFusionPanel();
  </script>

</body>
</html>
