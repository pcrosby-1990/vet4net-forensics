<!DOCTYPE html>
<html>
<head>
  <title>Unity Emotional & Mythic Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0b0b0b;
      color: #eee;
      padding: 2em;
    }
    h1 {
      font-size: 2em;
      color: #0ff;
      margin-bottom: 1em;
    }
    .section {
      background: #1a1a1a;
      padding: 1em;
      margin: 1em 0;
      border-left: 5px solid #f0f;
      border-radius: 6px;
    }
    .section h2 {
      margin: 0;
      color: #f0f;
    }
    .section p, .section li {
      font-size: 0.9em;
    }
    .trait {
      background: #222;
      padding: 0.5em;
      margin: 0.2em;
      border-radius: 4px;
      display: inline-block;
    }
    ul {
      padding-left: 1em;
    }
  </style>
</head>
<body>
  <h1>🧠🧭 Unity Emotional & Mythic Dashboard</h1>

  <div class="section" id="archetype">
    <h2>Current Archetype</h2>
    <p id="archetypeValue">Loading...</p>
  </div>

  <div class="section" id="traits">
    <h2>Active Traits</h2>
    <div id="traitList"></div>
  </div>

  <div class="section" id="arc">
    <h2>Emotional Arc</h2>
    <div id="arcList"></div>
  </div>

  <div class="section" id="memory">
    <h2>Recent Memory Log</h2>
    <ul id="memoryList"></ul>
  </div>

  <div class="section" id="inventory">
    <h2>Inventory</h2>
    <ul id="inventoryList"></ul>
  </div>

  <div class="section" id="quests">
    <h2>Quests</h2>
    <ul id="questList"></ul>
  </div>

  <div class="section" id="companions">
    <h2>Companions</h2>
    <ul id="companionList"></ul>
  </div>

  <div class="section" id="dreams">
    <h2>Dreams</h2>
    <ul id="dreamList"></ul>
  </div>

  <div class="section" id="shadows">
    <h2>Shadow Traits</h2>
    <ul id="shadowList"></ul>
  </div>

  <script src="unity_dashboard.js"></script>
</body>
</html>
