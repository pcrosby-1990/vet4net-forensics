<!DOCTYPE html>
<html>
<head>
  <title>Unity Lore Archive</title>
  <style>
    body {
      background: #0c0c0c;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #f0f; }
    .filter {
      margin-bottom: 1em;
    }
    select, input {
      padding: 0.5em;
      margin-right: 0.5em;
      font-size: 1em;
    }
    .entry {
      background: #1a1a1a;
      padding: 1em;
      margin: 1em 0;
      border-left: 5px solid #f0f;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
    }
    .entry h3 { margin: 0; color: #f0f; }
    .entry p { font-size: 0.9em; }
    .entry button {
      background: #333;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      margin-top: 0.5em;
      border-radius: 4px;
      cursor: pointer;
    }
    .entry button:hover { background: #555; }
  </style>
</head>
<body>
  <h1>📚 Unity Lore Archive</h1>
  <div class="filter">
    <select id="typeFilter">
      <option value="myths">Myths</option>
      <option value="rituals">Rituals</option>
      <option value="traits">Traits</option>
      <option value="dreams">Dreams</option>
      <option value="shadows">Shadows</option>
      <option value="relics">Relics</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search keyword..." />
    <button onclick="searchLore()">Search</button>
  </div>
  <div id="results"></div>

  <script src="lore_archive_ui.js"></script>
</body>
</html>
