<!DOCTYPE html>
<html>
<head>
  <title>Unity Quest Visualizer</title>
  <style>
    body { background: #0b0b0b; color: #eee; font-family: 'Segoe UI', sans-serif; padding: 2em; }
    .section { margin-bottom: 2em; }
    .stage { padding: 0.5em; margin: 0.3em 0; background: #222; border-left: 5px solid #f0f; }
    .completed { border-left-color: #0f0; opacity: 0.7; }
    .active { border-left-color: #ff0; font-weight: bold; }
    .label { font-size: 1.2em; color: #0ff; }
  </style>
</head>
<body>
  <h1>🧙 Unity Mythic Quest</h1>

  <div class="section">
    <div class="label">Current Quest:</div>
    <div id="questTitle">Loading...</div>
  </div>

  <div class="section">
    <div class="label">Archetype:</div>
    <div id="archetypeName">Loading...</div>
  </div>

  <div class="section">
    <div class="label">Stages:</div>
    <div id="stageList"></div>
  </div>

  <script src="quest_visualizer.js"></script>
</body>
</html>
