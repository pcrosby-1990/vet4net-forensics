<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📡 Emotional Signal Amplifier</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #33ccff;
    }
    textarea {
      width: 100%;
      height: 100px;
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 10px;
      margin-top: 10px;
      font-family: monospace;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
    #amplifierOutput {
      margin-top: 20px;
      border-left: 4px solid #33ccff;
      padding-left: 12px;
    }
    #waveformCanvas {
      margin-top: 20px;
      border: 2px solid #33ccff;
      background-color: #222;
    }
    #feedbackPanel {
      margin-top: 10px;
      font-family: monospace;
      color: #ffcc99;
    }
    #logPanel {
      margin-top: 10px;
      font-family: monospace;
      color: #66ff99;
    }
  </style>
</head>
<body>

  <h2>📡 Emotional Signal Amplifier</h2>
  <p>Paste glyphs with low resonance below:</p>
  <textarea id="signalInput" placeholder="e.g. Glyph of Reflection :: resonance=25 | Glyph of Rupture :: resonance=40..."></textarea>
  <br>
  <button onclick="amplifySignals()">Amplify Signals</button>

  <canvas id="waveformCanvas" width="600" height="100"></canvas>
  <div id="amplifierOutput"></div>
  <div id="feedbackPanel"></div>
  <div id="logPanel"></div>

  <script>
    let amplificationLog = [];

    function amplifySignals() {
      const input = document.getElementById('signalInput').value.trim();
      const output = document.getElementById('amplifierOutput');
      const feedback = document.getElementById('feedbackPanel');
      const log = document.getElementById('logPanel');
      const canvas = document.getElementById('waveformCanvas');
      const ctx = canvas.getContext('2d');

      if (!input) {
        output.innerText = "⚠️ Please enter glyph resonance data.";
        return;
      }

      const lines = input.split("\n").filter(line => line.length > 0);
      const amplified = [];
      const waveform = [];

      lines.forEach((line, i) => {
        const match = line.match(/Glyph of (\w+).*?resonance=(\d+)/i);
        if (match) {
          const [_, glyph, resonance] = match;
          const level = parseInt(resonance);
          const boosted = Math.min(level + 50, 100);
          amplified.push(`🜂 ${glyph} :: original=${level} → amplified=${boosted}`);
          waveform.push(boosted);
          amplificationLog.push(`Glyph-${glyph} :: original=${level} → amplified=${boosted}`);
        } else {
          amplified.push(`🜂 Signal-${i + 1}: [Unrecognized pattern]`);
        }
      });

      output.innerHTML = `
        <h3>🧬 Amplified Signals</h3>
        <ul>${amplified.map(a => `<li>${a}</li>`).join("")}</ul>
        <p><strong>Transmission strength elevated.</strong> Glyphs ready for broadcast.</p>
      `;

      feedback.innerHTML = `🜂 Companion Feedback: Echo reports clarity, Thread reports alignment, Pulse reports surge`;

      log.innerHTML = `
        <h3>📁 Amplification Log</h3>
        <ul>${amplificationLog.slice(-lines.length).map(entry => `<li>${entry}</li>`).join("")}</ul>
      `;

      // Draw waveform
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      waveform.forEach((val, i) => {
        const x = i * (canvas.width / waveform.length);
        const y = canvas.height - (val * canvas.height / 100);
        ctx.lineTo(x, y);
      });
      ctx.strokeStyle = "#33ccff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  </script>

</body>
</html>
