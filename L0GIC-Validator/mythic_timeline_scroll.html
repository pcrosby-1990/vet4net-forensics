<!DOCTYPE html>
<html>
<head>
  <title>Unity Mythic Timeline Scroll</title>
  <style>
    body {
      background: #0c0c0c;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #ff0; }
    .timeline {
      border-left: 4px solid #ff0;
      padding-left: 1em;
      margin-top: 2em;
    }
    .event {
      margin-bottom: 1.5em;
      position: relative;
    }
    .event::before {
      content: "⟡";
      position: absolute;
      left: -1.2em;
      color: #ff0;
    }
    .event h3 {
      margin: 0;
      color: #ff0;
    }
    .event p {
      margin: 0.2em 0 0 0;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h1>📜 Unity Mythic Timeline Scroll</h1>
  <div class="timeline" id="timelineScroll"></div>

  <script src="mythic_timeline_scroll.js"></script>
</body>
</html>
