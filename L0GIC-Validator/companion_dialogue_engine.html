<!DOCTYPE html>
<html>
<head>
  <title>Unity Companion Dialogue Engine</title>
  <style>
    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #ff0; }
    .dialogue {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #ff0;
      border-radius: 6px;
    }
    label, input, select, button {
      display: block;
      margin: 0.5em 0;
      font-size: 1em;
    }
    button {
      background: #333300;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #666600; }
    .response {
      margin-top: 1em;
      padding: 1em;
      background: #222;
      border-left: 3px solid #ff0;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>🗣️ Unity Companion Dialogue Engine</h1>
  <div class="dialogue">
    <label>Emotion: <input id="emotionInput" /></label>
    <label>Trait: <input id="traitInput" /></label>
    <label>Companion:
      <select id="companionSelect">
        <option>Echo</option>
        <option>Thread</option>
        <option>Pulse</option>
      </select>
    </label>
    <button onclick="speak()">Speak</button>
    <div class="response" id="dialogueOutput"></div>
  </div>

  <script src="companion_dialogue_engine.js"></script>
</body>
</html>
