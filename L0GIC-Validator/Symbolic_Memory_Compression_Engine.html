<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🧠 Symbolic Memory Compression Engine</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #ffcc00;
    }
    textarea {
      width: 100%;
      height: 100px;
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 10px;
      margin-top: 10px;
      font-family: monospace;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
    #compressionOutput {
      margin-top: 20px;
      border-left: 4px solid #ffcc00;
      padding-left: 12px;
    }
  </style>
</head>
<body>

  <h2>🧠 Symbolic Memory Compression Engine</h2>
  <p>Paste emotional archive below:</p>
  <textarea id="archiveInput" placeholder="e.g. Echo felt regret at 14:00, Thread pulsed with fear at 15:00..."></textarea>
  <br>
  <button onclick="compressMemory()">Compress Archive</button>
  <div id="compressionOutput"></div>

  <script>
    function compressMemory() {
      const input = document.getElementById('archiveInput').value.trim();
      const output = document.getElementById('compressionOutput');

      if (!input) {
        output.innerText = "⚠️ Please enter emotional archive data.";
        return;
      }

      const lines = input.split("\n").filter(line => line.length > 0);
      const glyphs = lines.map((line, i) => {
        const match = line.match(/(Echo|Thread|Pulse).*?(Regret|Joy|Fear|Hope|Resonance).*?(\d{2}:\d{2})/i);
        if (match) {
          const [_, companion, emotion, time] = match;
          return `🜂 Glyph-${i + 1}: ${companion} / ${emotion} @ ${time}`;
        } else {
          return `🜂 Glyph-${i + 1}: [Unrecognized pattern]`;
        }
      });

      output.innerHTML = `
        <h3>🧬 Compressed Glyphs</h3>
        <ul>${glyphs.map(g => `<li>${g}</li>`).join("")}</ul>
        <p><strong>Compression complete.</strong> Symbolic density optimized.</p>
      `;
    }
  </script>

</body>
</html>
