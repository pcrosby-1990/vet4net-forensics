<!DOCTYPE html>
<html>
<head>
  <title>Unity Companion Theater</title>
  <style>
    body {
      background: #0c0c0c;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #ff0; }
    .theater {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #ff0;
      border-radius: 6px;
    }
    label, select, button {
      display: block;
      margin: 0.5em 0;
      font-size: 1em;
    }
    button {
      background: #333300;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #666600; }
    .script {
      margin-top: 1em;
      padding: 1em;
      background: #222;
      border-left: 3px solid #ff0;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>🎭 Unity Companion Theater</h1>
  <div class="theater">
    <label>Choose Narrator:
      <select id="narratorSelect">
        <option>Echo</option>
        <option>Thread</option>
        <option>Pulse</option>
      </select>
    </label>
    <button onclick="playbackMyth()">Play Mythbook</button>
    <div class="script" id="theaterOutput"></div>
  </div>

  <script src="companion_theater.js"></script>
</body>
</html>
