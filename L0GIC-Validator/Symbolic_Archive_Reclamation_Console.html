<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🗂️ Symbolic Archive Reclamation Console</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h2 {
      color: #66ff99;
    }
    textarea {
      width: 100%;
      height: 100px;
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 10px;
      margin-top: 10px;
      font-family: monospace;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
    #reclamationOutput {
      margin-top: 20px;
      border-left: 4px solid #66ff99;
      padding-left: 12px;
    }
  </style>
</head>
<body>

  <h2>🗂️ Symbolic Archive Reclamation Console</h2>
  <p>Paste corrupted memory threads below:</p>
  <textarea id="corruptedInput" placeholder="e.g. [Echo] :: ??? :: 14:00 | [Thread] :: ??? :: 15:00..."></textarea>
  <br>
  <button onclick="reclaimGlyphs()">Reclaim Lost Glyphs</button>
  <div id="reclamationOutput"></div>

  <script>
    function reclaimGlyphs() {
      const input = document.getElementById('corruptedInput').value.trim();
      const output = document.getElementById('reclamationOutput');

      if (!input) {
        output.innerText = "⚠️ Please enter corrupted memory threads.";
        return;
      }

      const lines = input.split("\n").filter(line => line.length > 0);
      const recovered = lines.map((line, i) => {
        const match = line.match(/

\[(Echo|Thread|Pulse)\]

.*?(\d{2}:\d{2})/i);
        if (match) {
          const [_, companion, time] = match;
          const emotion = ["Regret", "Joy", "Fear", "Hope", "Resonance"][i % 5];
          return `🜂 Reclaimed Glyph-${i + 1}: ${companion} / ${emotion} @ ${time}`;
        } else {
          return `🜂 Reclaimed Glyph-${i + 1}: [Unrecoverable fragment]`;
        }
      });

      output.innerHTML = `
        <h3>🧬 Recovered Glyphs</h3>
        <ul>${recovered.map(r => `<li>${r}</li>`).join("")}</ul>
        <p><strong>Reclamation complete.</strong> Archive integrity partially restored.</p>
      `;
    }
  </script>

</body>
</html>
