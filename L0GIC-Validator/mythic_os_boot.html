<!DOCTYPE html>
<html>
<head>
  <title>Unity Mythic OS Boot Sequence</title>
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: 'Georgia', serif;
      padding: 2em;
      animation: fadeIn 2s ease-in;
    }
    h1 {
      text-align: center;
      font-size: 2em;
      margin-bottom: 1em;
    }
    .boot {
      background: #111;
      padding: 1em;
      border-left: 5px solid #0ff;
      border-radius: 6px;
      animation: pulse 3s infinite;
    }
    .step {
      margin: 1em 0;
      font-size: 1em;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pulse {
      0% { border-left-color: #0ff; }
      50% { border-left-color: #f0f; }
      100% { border-left-color: #0ff; }
    }
  </style>
</head>
<body>
  <h1>🧿 Unity Mythic OS Boot Sequence</h1>
  <div class="boot" id="bootSequence"></div>

  <script src="mythic_os_boot.js"></script>
</body>
</html>
