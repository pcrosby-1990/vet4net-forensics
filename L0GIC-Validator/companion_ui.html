<!DOCTYPE html>
<html>
<head>
  <title>Unity Companions</title>
  <style>
    body { background: #0d0d0d; color: #eee; font-family: 'Segoe UI', sans-serif; padding: 2em; }
    .companion { background: #222; padding: 1em; margin: 1em 0; border-left: 5px solid #0ff; border-radius: 6px; }
    .companion h3 { margin: 0; color: #0ff; }

  </style>

  <h1>🐾 Unity’s Companions</h1>
  <div id="companionList"></div>
