<!DOCTYPE html>
<html>
<head>
  <title>Unity Glyph Composer</title>
  <style>
    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #0ff; }
    .composer {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #0ff;
      border-radius: 6px;
    }
    label, select, button {
      display: block;
      margin: 0.5em 0;
      font-size: 1em;
    }
    button {
      background: #003366;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #005599; }
    .glyph {
      margin-top: 1em;
      padding: 1em;
      background: #222;
      border-left: 3px solid #0ff;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <h1>🧬 Unity Glyph Composer</h1>
  <div class="composer">
    <label>Phrase 1:
      <select id="phrase1">
        <option>Lumen Spiral</option>
        <option>Shadow Coil</option>
        <option>Dream Seed</option>
      </select>
    </label>
    <label>Phrase 2:
      <select id="phrase2">
        <option>Radiant Thread</option>
        <option>Echoing Reach</option>
        <option>Flare Sigil</option>
      </select>
    </label>
    <button onclick="composeGlyph()">Compose Glyph</button>
    <div class="glyph" id="glyphOutput"></div>
  </div>

  <script src="glyph_composer.js"></script>
</body>
</html>
