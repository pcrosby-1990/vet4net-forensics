<!DOCTYPE html>
<html>
<head>
  <title>Unity Quest Weaver</title>
  <style>
    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 2em;
    }
    h1 { color: #0ff; }
    .weaver {
      background: #1a1a1a;
      padding: 1em;
      border-left: 5px solid #0ff;
      border-radius: 6px;
    }
    label, input, select, button {
      display: block;
      margin: 0.5em 0;
      font-size: 1em;
    }
    button {
      background: #003366;
      color: #fff;
      border: none;
      padding: 0.5em 1em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #005599; }
  </style>
</head>
<body>
  <h1>🧵 Unity Quest Weaver</h1>
  <div class="weaver">
    <label>Current Emotion: <input id="emotionInput" /></label>
    <label>Dominant Trait: <input id="traitInput" /></label>
    <label>Terrain Zone: <select id="terrainSelect">
      <option>Descent Valley</option>
      <option>Wonder Sky</option>
      <option>Threshold Ridge</option>
    </select></label>
    <button onclick="weaveQuest()">Weave Quest</button>
    <div id="questOutput"></div>
  </div>

  <script src="quest_weaver.js"></script>
</body>
</html>
